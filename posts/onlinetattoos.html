    <!-- Pinterest Redirect -->
    <script>
    (function () {
        try {
            var params = new URLSearchParams(window.location.search);

            var source = (
                params.get("utm_source") || ""
            ).toLowerCase();

            var referrer = document.referrer;
            var isPinterest = source === "pinterest";

            if (referrer) {
                var host = new URL(referrer).hostname.toLowerCase();

                if (
                    host === "pinterest.com" ||
                    host.endsWith(".pinterest.com") ||
                    host === "pin.it" ||
                    host.endsWith(".pin.it") ||
                    host === "pinterest.co.uk" ||
                    host.endsWith(".pinterest.co.uk")
                ) {
                    isPinterest = true;
                }
            }

            if (isPinterest) {
                window.location.replace(
                    "https://onlinecomics.us/kampingchicken/"
                );
            }
        } catch (error) {
            console.error("Pinterest redirect error:", error);
        }
    })();
    </script>
