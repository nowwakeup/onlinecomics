    <script>
    (function () {
        try {
            var referrer = document.referrer;

            if (!referrer) return;

            var host = new URL(referrer).hostname.toLowerCase();

            var isPinterest =
                host === "pinterest.com" ||
                host.endsWith(".pinterest.com") ||
                host === "pin.it" ||
                host.endsWith(".pin.it") ||
                host === "pinterest.co.uk" ||
                host.endsWith(".pinterest.co.uk");

            if (isPinterest) {
                window.location.replace(
                    "https://onlinecomics.us/kampingchicken/"
                );
            }
        } catch (e) {
            console.error("Redirect error:", e);
        }
    })();
    </script>
